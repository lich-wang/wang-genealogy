name: CI & Deploy

# Auto-release: every push to main runs tests, then deploys the API (Worker)
# and the web app (Pages) to Cloudflare. Worker secrets (AUTH_SECRET,
# BOOTSTRAP_ADMIN_HASHES) are managed via `wrangler secret` and are NOT touched
# by this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_cached_snapshot:
        description: '跳过 D1 导出，验证并发布最近一次公开快照缓存'
        required: false
        type: boolean
        default: false
  schedule:
    # Refresh the anonymous read model daily at 02:17 Asia/Shanghai.
    - cron: '17 18 * * *'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  API_BASE: https://wang-genealogy-api.lich-wang8718.workers.dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Unit tests
        run: npm test
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Build web (typechecks + bundles)
        run: npm run build --workspace apps/web
        env:
          VITE_API_BASE: ${{ env.API_BASE }}

  deploy:
    # Only deploy on pushes to main, after tests pass.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Restore last public snapshot
        id: public-snapshot-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/api/tree-snapshot
          key: public-snapshot-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            public-snapshot-

      - name: Apply D1 migrations (remote)
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$(git diff --diff-filter=AM --name-only HEAD^ HEAD -- 'migrations/*.sql')" ]; then
            echo "No migration changes; skipping remote D1 migration check."
          else
            cd apps/api
            npx wrangler d1 migrations apply wang-genealogy --remote
          fi

      - name: Build anonymous zero-D1 read model
        env:
          FORCE_CACHED_SNAPSHOT: ${{ inputs.use_cached_snapshot || false }}
        run: |
          if [ "$FORCE_CACHED_SNAPSHOT" != "true" ] && npx wrangler d1 export wang-genealogy --remote --output=/tmp/wang-genealogy-public.sql --config apps/api/wrangler.toml > /tmp/wang-genealogy-export.log 2>&1; then
            rm -f /tmp/wang-genealogy-public.sqlite
            sqlite3 -cmd "PRAGMA journal_mode=OFF;" -cmd "PRAGMA synchronous=OFF;" -cmd "BEGIN;" /tmp/wang-genealogy-public.sqlite ".read /tmp/wang-genealogy-public.sql" "COMMIT;"
            PUBLIC_SNAPSHOT_DB=/tmp/wang-genealogy-public.sqlite npm run build:public-snapshot
            echo "PUBLIC_SNAPSHOT_REFRESHED=true" >> "$GITHUB_ENV"
          elif [ -f apps/api/tree-snapshot/public/index.json ] && find apps/api/tree-snapshot -maxdepth 1 -name 'component-*.json' -print -quit | grep -q .; then
            if [ -f /tmp/wang-genealogy-export.log ]; then
              sed -E 's#https://[^[:space:]]+#<redacted-export-url>#g' /tmp/wang-genealogy-export.log >&2
            fi
            echo "::warning::D1 export unavailable; deploying the last validated public snapshot cache."
            echo "PUBLIC_SNAPSHOT_REFRESHED=false" >> "$GITHUB_ENV"
          else
            sed -E 's#https://[^[:space:]]+#<redacted-export-url>#g' /tmp/wang-genealogy-export.log >&2
            echo "No validated public snapshot cache is available." >&2
            exit 1
          fi
          npm run publish:import-queue

      - name: Save refreshed public snapshot
        if: env.PUBLIC_SNAPSHOT_REFRESHED == 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/api/tree-snapshot
          key: public-snapshot-${{ github.sha }}-${{ github.run_attempt }}

      - name: Deploy API (Worker)
        working-directory: apps/api
        run: npx wrangler deploy

      - name: Build web
        run: npm run build --workspace apps/web
        env:
          VITE_API_BASE: ${{ env.API_BASE }}

      - name: Deploy web (Pages)
        working-directory: apps/web
        run: npx wrangler pages deploy dist --project-name wang-genealogy-web --branch main
