name: CI & Deploy

# Auto-release: every push to main runs tests, then deploys the API (Worker)
# and the web app (Pages) to Cloudflare. Worker secrets (AUTH_SECRET,
# BOOTSTRAP_ADMIN_HASHES) are managed via `wrangler secret` and are NOT touched
# by this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  API_BASE: https://wang-genealogy-api.lich-wang8718.workers.dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Build web (typechecks + bundles)
        run: npm run build --workspace apps/web
        env:
          VITE_API_BASE: ${{ env.API_BASE }}

  deploy:
    # Only deploy on pushes to main, after tests pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply D1 migrations (remote)
        working-directory: apps/api
        run: npx wrangler d1 migrations apply wang-genealogy --remote

      - name: Deploy API (Worker)
        working-directory: apps/api
        run: npx wrangler deploy

      - name: Build web
        run: npm run build --workspace apps/web
        env:
          VITE_API_BASE: ${{ env.API_BASE }}

      - name: Deploy web (Pages)
        working-directory: apps/web
        run: npx wrangler pages deploy dist --project-name wang-genealogy-web --branch main
