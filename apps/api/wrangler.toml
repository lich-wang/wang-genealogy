name = "wang-genealogy-api"
main = "src/index.ts"
compatibility_date = "2026-09-04"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./tree-snapshot"
binding = "TREE_SNAPSHOT"
run_worker_first = true

# D1 binding. database_id is filled in after `wrangler d1 create wang-genealogy`.
[[d1_databases]]
binding = "DB"
database_name = "wang-genealogy"
database_id = "cf1ebbce-7ede-4733-87de-a9996917e654"
migrations_dir = "../../migrations"

[vars]
# AUTH_SECRET is provided via `wrangler secret put AUTH_SECRET` (not here).
# For local dev, put AUTH_SECRET in apps/api/.dev.vars (gitignored).
ALLOWED_ORIGIN = "*"
# Email Routing sends this base address and its WG-* subaddresses to this Worker.
REGISTRATION_EMAIL_ADDRESS = "verify@history.wang"

[observability]
enabled = true
head_sampling_rate = 1
